<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock</title>
<style>
  /* Notion paints its page colour behind an embed, so the widget carries its own.
     Light first, because this planner is light first, with a dark-mode override. */
  :root{
    --page:#FFFFFF;
    --deep:#0C2E36;
    --petrol:#1C5A66;
    --teal:#35A0A0;
    --bone:#F3EEE6;
    --ink:rgba(243,238,230,.92);
    --muted:rgba(243,238,230,.62);
  }
  @media (prefers-color-scheme: dark){ :root{ --page:#191919; } }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--page);
    display:flex;align-items:center;justify-content:center;
    padding:10px;
    font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:520px;
    border-radius:20px;
    padding:26px 30px;
    background:
      radial-gradient(520px 220px at 88% -30%, rgba(53,160,160,.55), transparent 62%),
      linear-gradient(135deg,var(--deep),var(--petrol));
    box-shadow:0 10px 30px rgba(12,46,54,.22);
    position:relative;overflow:hidden;
  }
  .card:after{                     /* the same dot grain as the covers */
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0);
    background-size:22px 22px;
  }
  .row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;position:relative}
  .time{
    font-size:clamp(44px,12vw,68px);
    font-weight:700;letter-spacing:-1.5px;line-height:1;
    color:var(--ink);font-variant-numeric:tabular-nums;
  }
  .suffix{font-size:.34em;font-weight:600;letter-spacing:1.6px;margin-left:.28em;color:var(--muted)}
  .right{text-align:right;padding-bottom:6px}
  .day{
    font-size:clamp(13px,3.4vw,16px);font-weight:700;
    letter-spacing:2.6px;text-transform:uppercase;color:var(--ink);
  }
  .date{font-size:clamp(12px,3vw,14.5px);color:var(--muted);margin-top:5px;letter-spacing:.3px}
  .rule{height:1px;background:rgba(243,238,230,.18);margin:18px 0 14px;position:relative}
  .note{font-size:12.5px;color:var(--muted);letter-spacing:.2px;position:relative}
  @media (max-width:420px){
    .row{flex-direction:column;align-items:flex-start;gap:10px}
    .right{text-align:left;padding-bottom:0}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div class="time" id="time">--:--<span class="suffix" id="suffix"></span></div>
      <div class="right">
        <div class="day" id="day">&nbsp;</div>
        <div class="date" id="date">&nbsp;</div>
      </div>
    </div>
    <div class="rule"></div>
    <div class="note" id="note">&nbsp;</div>
  </div>

<script>
/* Read the clock every tick. Never count ticks: a background tab is throttled to
   about one a minute and a phone suspends the page entirely, so a counter drifts
   or freezes. Deriving from Date() means the display is correct the moment the
   tab comes back. */
(function () {
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];

  function ordinal(n) {
    if (n > 3 && n < 21) return n + "th";
    return n + ({1:"st",2:"nd",3:"rd"}[n % 10] || "th");
  }

  function weekLeft(d) {
    var left = (7 - d.getDay()) % 7;            // days until Sunday
    if (left === 0) return "Last day of the week.";
    if (left === 1) return "One day left this week.";
    return left + " days left this week.";
  }

  function render() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    var am = h < 12 ? "AM" : "PM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;

    document.getElementById("time").innerHTML =
      h12 + ":" + (m < 10 ? "0" + m : m) +
      '<span class="suffix">' + am + "</span>";
    document.getElementById("day").textContent = DAYS[d.getDay()];
    document.getElementById("date").textContent =
      ordinal(d.getDate()) + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
    document.getElementById("note").textContent = weekLeft(d);
  }

  render();
  setInterval(render, 1000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) render();
  });
  window.addEventListener("pageshow", render);
})();
</script>
</body>
</html>
