<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar</title>
<style>
  :root{
    --ink:#2F3A28;
    --muted:#A8AE9E;
    --sage:#6E8467;
    --sage-soft:#E6EDE2;
    --on-sage:#FFFFFF;
    --rule:#E4E8DE;
    --card:#F7F6F1;
    --edge:#E0E5D8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#E8EAE3;
      --muted:#6E7568;
      --sage:#A3B79A;
      --sage-soft:#2E3A2A;
      --on-sage:#1E211C;
      --rule:#3A3F35;
      --card:#232720;
      --edge:#343930;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;min-height:100%;
    background:transparent;          /* Notion's page shows through around the card */
  }
  body{
    color:var(--ink);
    font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;
    padding:2px;display:flex;justify-content:center;align-items:stretch;
  }
  .cal{
    width:100%;
    background:var(--card);
    border:1px solid var(--edge);
    border-radius:14px;
    padding:16px 16px 14px;
    position:relative;
  }
  .cal::before{                       /* small sage tick, top-centre */
    content:"";position:absolute;top:0;left:50%;
    width:34px;height:2px;margin-left:-17px;
    background:var(--sage);opacity:.5;
    border-radius:0 0 2px 2px;
  }
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .title{font-family:Georgia,'Iowan Old Style',serif;font-size:16px;letter-spacing:.02em}
  .title .yr{color:var(--muted);font-style:italic;margin-left:5px;font-size:13px}
  .nav{display:flex;gap:2px}
  button{
    border:0;background:transparent;color:var(--muted);cursor:pointer;
    width:22px;height:22px;border-radius:6px;font-size:11px;line-height:1;
    display:grid;place-items:center;transition:background .15s,color .15s;
  }
  button:hover{background:var(--sage-soft);color:var(--sage)}
  .rule{height:1px;background:var(--rule);margin:9px 0 7px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dow{
    font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--sage);text-align:center;padding-bottom:5px;
  }
  .cell{
    aspect-ratio:1;display:grid;place-items:center;
    font-size:12px;border-radius:50%;font-variant-numeric:tabular-nums;
  }
  .out{color:var(--muted);opacity:.45}
  .today{background:var(--sage);color:var(--on-sage);font-weight:600}
  .foot{
    margin-top:9px;text-align:center;font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);min-height:12px;
  }
  .foot b{color:var(--sage);font-weight:500;cursor:pointer}
</style>
</head>
<body>
  <div class="cal">
    <header>
      <div class="title"><span id="mn"></span><span class="yr" id="yr"></span></div>
      <div class="nav">
        <button id="prev" aria-label="Previous month">&#9664;</button>
        <button id="next" aria-label="Next month">&#9654;</button>
      </div>
    </header>
    <div class="rule"></div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="days"></div>
    <div class="foot" id="foot"></div>
  </div>
<script>
(function(){
  var mons=['January','February','March','April','May','June','July',
            'August','September','October','November','December'];
  var dows=['M','T','W','T','F','S','S'];
  var now=new Date();
  var today={y:now.getFullYear(),m:now.getMonth(),d:now.getDate()};
  var view={y:today.y,m:today.m};

  var dowsEl=document.getElementById('dows');
  dows.forEach(function(x){
    var e=document.createElement('div');e.className='dow';e.textContent=x;dowsEl.appendChild(e);
  });

  function cell(g,n,out,isToday){
    var e=document.createElement('div');
    e.className='cell'+(out?' out':'')+(isToday?' today':'');
    e.textContent=n; g.appendChild(e);
  }

  function draw(){
    document.getElementById('mn').textContent=mons[view.m];
    document.getElementById('yr').textContent=view.y;
    var g=document.getElementById('days'); g.innerHTML='';

    var first=new Date(view.y,view.m,1).getDay();
    var lead=(first+6)%7;                                  // Monday-first
    var dim=new Date(view.y,view.m+1,0).getDate();
    var prevDim=new Date(view.y,view.m,0).getDate();

    for(var i=lead;i>0;i--) cell(g,prevDim-i+1,true,false);
    for(var d=1;d<=dim;d++){
      cell(g,d,false,(d===today.d&&view.m===today.m&&view.y===today.y));
    }
    var tail=(7-((lead+dim)%7))%7;
    for(var t=1;t<=tail;t++) cell(g,t,true,false);

    var same=(view.y===today.y&&view.m===today.m);
    document.getElementById('foot').innerHTML = same ? '' : '<b id="back">Back to today</b>';
    var b=document.getElementById('back');
    if(b) b.onclick=function(){view={y:today.y,m:today.m};draw();};
  }

  document.getElementById('prev').onclick=function(){ if(--view.m<0){view.m=11;view.y--} draw(); };
  document.getElementById('next').onclick=function(){ if(++view.m>11){view.m=0;view.y++} draw(); };
  draw();

  setInterval(function(){                                  // roll over at midnight
    var n=new Date();
    if(n.getDate()!==today.d){
      today={y:n.getFullYear(),m:n.getMonth(),d:n.getDate()};
      draw();
    }
  },60000);
})();
</script>
</body>
</html>
