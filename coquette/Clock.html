<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock</title>
<style>
  :root{
    --ink:#4F3340;
    --muted:#786066;
    --rose:#8E4059;
    --rose-soft:#FBE4EA;
    --on-rose:#FFFFFF;
    --rule:#F2E0DE;
    --card:#FDF1EF;
    --edge:#F0DCDA;
    --page:#FFFFFF;

    --petal-opacity:.20;
    --wash:linear-gradient(150deg,rgba(251,228,234,.55),rgba(253,241,239,.80));
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#F2DDDF;
      --muted:#AD939B;
      --rose:#F0B9C8;
      --rose-soft:#3A2932;
      --on-rose:#241C20;
      --rule:#3A2B30;
      --card:#241C20;
      --edge:#332529;
      --page:#191919;
      --petals:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22200%22%20height%3D%22200%22%20viewBox%3D%220%200%20200%20200%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23F0B9C8%22%20stroke-width%3D%221.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%2246%22%20r%3D%222.8%22%2F%3E%3Cpath%20d%3D%22M48%2040a6%206%200%201%201-6%206%22%2F%3E%3Cpath%20d%3D%22M48%2035.4a10.6%2010.6%200%201%201-10.6%2010.6%22%2F%3E%3Cpath%20d%3D%22M48%2030.6a15.4%2015.4%200%201%201-15.4%2015.4%22%2F%3E%3Cpath%20d%3D%22M64%2060c6.6%201.8%2010%206.2%2011%2013-6.6-1.2-10-5.6-11-13z%22%2F%3E%3Cpath%20d%3D%22M62%2062c-1.4%206.8-5.4%2010.6-12%2011.6%201.4-6.8%205.4-10.6%2012-11.6z%22%2F%3E%3Ccircle%20cx%3D%22146%22%20cy%3D%22134%22%20r%3D%222.2%22%2F%3E%3Cpath%20d%3D%22M146%20129.2a4.8%204.8%200%201%201-4.8%204.8%22%2F%3E%3Cpath%20d%3D%22M146%20124.8a9.2%209.2%200%201%201-9.2%209.2%22%2F%3E%3Cpath%20d%3D%22M158%20145c5%201.6%207.6%204.8%208.4%2010.2-5.2-1-7.8-4.2-8.4-10.2z%22%2F%3E%3Cpath%20d%3D%22M44%20174v-24%22%2F%3E%3Cpath%20d%3D%22M44%20163c-6.2-1.2-8.8-5-8.8-9.8%205%200%207.6%203.6%208.8%209.8z%22%2F%3E%3Cpath%20d%3D%22M44%20170c6.2-1.2%208.8-5%208.8-9.8-5%200-7.6%203.6-8.8%209.8z%22%2F%3E%3Cpath%20d%3D%22M168%2052c-1.2%206.2-5%209.6-10.8%2010.4%201.2-6.2%205-9.6%2010.8-10.4z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
      --petal-opacity:.16;
      --wash:linear-gradient(150deg,rgba(58,41,50,.55),rgba(36,28,32,.80));
    }
  }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;min-height:100%;
    background:var(--page);          /* matches Notion's page, so no white frame in dark mode */
  }
  body{
    color:var(--ink);
    font-family:Georgia,'Iowan Old Style','Times New Roman',serif;
    display:flex;align-items:stretch;justify-content:center;
    padding:2px;
  }
  .wrap{
    width:100%;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--wash),var(--card);
    overflow:hidden;
    border:1px solid var(--edge);
    border-radius:14px;
    padding:22px 16px;
    position:relative;
  }
  .wrap::before{                      /* small rose tick, top-centre */
    content:"";position:absolute;top:0;left:50%;
    width:34px;height:2px;margin-left:-17px;
    background:var(--rose);opacity:.5;
    border-radius:0 0 2px 2px;
  }
  .time{
    font-size:clamp(34px,16vw,58px);
    line-height:1;letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;justify-content:center;gap:.12em;
  }
  .colon{animation:blink 2s steps(1,end) infinite;color:var(--rose)}
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.25}}
  .mer{
    font-size:.28em;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);font-family:ui-sans-serif,-apple-system,'Segoe UI',sans-serif;
    transform:translateY(-.15em);
  }
  .rule{height:1px;background:var(--rule);margin:12px auto 10px;width:52px}
  .day{
    font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--rose);font-family:ui-sans-serif,-apple-system,'Segoe UI',sans-serif;
    margin-bottom:5px;
  }
  .date{font-size:14px;color:var(--muted);font-style:italic}
  @media (prefers-reduced-motion:reduce){.colon{animation:none}}
  .wrap::after,.cal::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:var(--petals) repeat center/200px 200px;
    opacity:var(--petal-opacity);pointer-events:none;z-index:0;
  }
  .wrap>*,.cal>*{position:relative;z-index:1}
</style>
</head>
<body>
  <div class="wrap">
    <div class="time" aria-live="polite">
      <span id="h">--</span><span class="colon">:</span><span id="m">--</span><span class="mer" id="ap"></span>
    </div>
    <div class="rule"></div>
    <div class="day" id="d"></div>
    <div class="date" id="dt"></div>
  </div>
<script>
(function(){
  var h=document.getElementById('h'),m=document.getElementById('m'),
      ap=document.getElementById('ap'),d=document.getElementById('d'),
      dt=document.getElementById('dt');
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var mons=['January','February','March','April','May','June','July',
            'August','September','October','November','December'];
  function pad(n){return n<10?'0'+n:''+n}
  function ord(n){
    if(n>3&&n<21)return n+'th';
    return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th');
  }
  function tick(){
    var n=new Date(), H=n.getHours(), hr=H%12; if(hr===0)hr=12;
    h.textContent=hr;
    m.textContent=pad(n.getMinutes());
    ap.textContent=H<12?'am':'pm';
    d.textContent=days[n.getDay()];
    dt.textContent=ord(n.getDate())+' '+mons[n.getMonth()]+' '+n.getFullYear();
  }
  tick(); setInterval(tick,1000);
})();
</script>
</body>
</html>
