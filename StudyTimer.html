<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study timer</title>
<style>
/* The scene is drawn inline, so the widget still needs no network and still
   paints its own background over Notion's white embed backing. */
:root{
  --page:#16162A; --line:rgba(255,255,255,.20);
  --ink:#F2F0FF; --muted:#C6C2E6;
  --focus:#FF6B5B; --short:#3FD0C9; --long:#A78BFA;
  /* The script overwrites --accent per mode. The default matters: without it
     an unstyled pill falls back to dark ink on dark glass. */
  --accent:#FF6B5B;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#16162A}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg svg{width:100%;height:100%;display:block}
.bg::after{content:"";position:absolute;inset:0;
 background:radial-gradient(ellipse at 50% 52%,
   rgba(22,22,42,.18) 0%, rgba(22,22,42,.52) 58%, rgba(22,22,42,.80) 100%)}
body{display:grid;place-items:center;padding:16px;position:relative;
 font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:var(--ink);-webkit-font-smoothing:antialiased}
.w{position:relative;z-index:1;width:100%;max-width:420px;
 background:rgba(28,28,52,.52);
 -webkit-backdrop-filter:blur(20px) saturate(1.25);
 backdrop-filter:blur(20px) saturate(1.25);
 border:1px solid rgba(255,255,255,.17);border-radius:22px;
 box-shadow:0 20px 54px rgba(0,0,0,.46);
 padding:20px 22px 18px;text-align:center}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.tab{flex:1;padding:7px 4px;border-radius:9px;border:0;cursor:pointer;
 background:transparent;color:var(--muted);font:inherit;font-size:12px;
 font-weight:700;letter-spacing:.6px;text-transform:uppercase;transition:.15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:rgba(255,255,255,.09);color:var(--accent)}
.time{font-size:60px;font-weight:800;letter-spacing:-2px;line-height:1;
 font-variant-numeric:tabular-nums;margin-bottom:4px}
.lbl{font-size:12.5px;color:var(--muted);margin-bottom:14px;min-height:16px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);
 transition:width .3s linear}
.row{display:flex;gap:9px;justify-content:center;margin-bottom:14px}
button.act{padding:10px 26px;border-radius:11px;border:1px solid var(--line);
 background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:700;
 cursor:pointer;transition:.15s}
button.act:hover{border-color:var(--accent);color:var(--accent)}
button.act.primary{background:rgba(255,255,255,.09);border-color:var(--accent);color:var(--accent)}
button.act.primary:hover{background:rgba(255,255,255,.16);color:var(--accent)}
.dots{display:flex;gap:7px;justify-content:center;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}
.count{font-size:11.5px;color:var(--muted);margin-left:7px}
</style></head>
<body>

</svg></div>
<div class="w" id="w">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-m="focus" aria-selected="true">Focus</button>
    <button class="tab" role="tab" data-m="short" aria-selected="false">Short</button>
    <button class="tab" role="tab" data-m="long"  aria-selected="false">Long</button>
  </div>
  <div class="time" id="t">25:00</div>
  <div class="lbl" id="lbl">Four focus blocks, then a long break.</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="row">
    <button class="act primary" id="go">Start</button>
    <button class="act" id="rs">Reset</button>
  </div>
  <div class="dots" id="dots"></div>
</div>
<script>
(function(){
  var MODES = {
    focus:{mins:25, col:'var(--focus)', msg:'Four focus blocks, then a long break.'},
    short:{mins:5,  col:'var(--short)', msg:'Stand up. Look at something further away than a screen.'},
    long: {mins:15, col:'var(--long)',  msg:'Properly away from the desk. You have earned it.'}
  };
  var mode='focus', left=MODES.focus.mins*60, total=left, tick=null, done=0, endAt=0;
  var t=document.getElementById('t'), bar=document.getElementById('bar'),
      go=document.getElementById('go'), rs=document.getElementById('rs'),
      lbl=document.getElementById('lbl'), dots=document.getElementById('dots'),
      w=document.getElementById('w');

  function paint(){
    var m=Math.floor(left/60), s=left%60;
    t.textContent=m+':'+(s<10?'0':'')+s;
    bar.style.width=(total?((total-left)/total*100):0)+'%';
    document.title=t.textContent+' · '+(mode==='focus'?'Focus':'Break');
  }
  function drawDots(){
    dots.innerHTML='';
    for(var i=0;i<4;i++){
      var d=document.createElement('span');
      d.className='dot'+(i<(done%4||(done&&done%4===0?4:0))?' on':'');
      dots.appendChild(d);
    }
    var c=document.createElement('span');
    c.className='count';
    c.textContent=done===0?'no blocks yet':done+(done===1?' block done':' blocks done');
    dots.appendChild(c);
  }
  function setMode(m,keepRunning){
    mode=m; total=left=MODES[m].mins*60;
    w.style.setProperty('--accent',MODES[m].col);
    lbl.textContent=MODES[m].msg;
    [].forEach.call(document.querySelectorAll('.tab'),function(b){
      b.setAttribute('aria-selected', b.dataset.m===m ? 'true':'false');
    });
    if(!keepRunning) stop();
    paint();
  }
  function stop(){ clearInterval(tick); tick=null; endAt=0; go.textContent='Start'; }
  function finish(){
    stop();
    if(mode==='focus'){ done++; drawDots(); setMode(done%4===0?'long':'short'); }
    else { setMode('focus'); }
    lbl.textContent = mode==='focus' ? 'Back to it.' : MODES[mode].msg;
  }
  // Read the clock, never count ticks. A browser throttles a background tab to
  // roughly one tick a minute, and a counted timer would therefore run slow in
  // exactly the case this thing is for: you start a block and switch away to
  // do the work. Phones suspend the page outright, which stops a counter dead.
  function sync(){
    if(!endAt) return;
    left = Math.max(0, Math.round((endAt - Date.now())/1000));
    paint();
    if(left===0) finish();
  }

  go.onclick=function(){
    if(tick){ sync(); stop(); return; }          // pause on what the clock says
    endAt = Date.now() + left*1000;
    go.textContent='Pause';
    tick=setInterval(sync,250);
  };

  // Correct the moment the tab or app comes back, rather than on the next tick.
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) sync(); });
  window.addEventListener('pageshow',sync);
  rs.onclick=function(){ stop(); left=total; paint(); };
  [].forEach.call(document.querySelectorAll('.tab'),function(b){
    b.onclick=function(){ setMode(b.dataset.m); };
  });
  setMode('focus'); drawDots(); paint();
})();
</script>
</body></html>
