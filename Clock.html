<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock</title>
<style>
  :root{
    --ink:#2F3A28;
    --muted:#8A9182;
    --sage:#6E8467;
    --rule:#E4E8DE;
    --card:#F7F6F1;
    --edge:#E0E5D8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#E8EAE3;
      --muted:#909784;
      --sage:#A3B79A;
      --rule:#3A3F35;
      --card:#232720;
      --edge:#343930;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;min-height:100%;
    background:transparent;          /* Notion's page shows through around the card */
  }
  body{
    color:var(--ink);
    font-family:Georgia,'Iowan Old Style','Times New Roman',serif;
    display:flex;align-items:stretch;justify-content:center;
    padding:2px;
  }
  .wrap{
    width:100%;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--card);
    border:1px solid var(--edge);
    border-radius:14px;
    padding:22px 16px;
    position:relative;
  }
  .wrap::before{                      /* small sage tick, top-centre */
    content:"";position:absolute;top:0;left:50%;
    width:34px;height:2px;margin-left:-17px;
    background:var(--sage);opacity:.5;
    border-radius:0 0 2px 2px;
  }
  .time{
    font-size:clamp(34px,16vw,58px);
    line-height:1;letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;justify-content:center;gap:.12em;
  }
  .colon{animation:blink 2s steps(1,end) infinite;color:var(--sage)}
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.25}}
  .mer{
    font-size:.28em;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);font-family:ui-sans-serif,-apple-system,'Segoe UI',sans-serif;
    transform:translateY(-.15em);
  }
  .rule{height:1px;background:var(--rule);margin:12px auto 10px;width:52px}
  .day{
    font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--sage);font-family:ui-sans-serif,-apple-system,'Segoe UI',sans-serif;
    margin-bottom:5px;
  }
  .date{font-size:14px;color:var(--muted);font-style:italic}
  @media (prefers-reduced-motion:reduce){.colon{animation:none}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="time" aria-live="polite">
      <span id="h">--</span><span class="colon">:</span><span id="m">--</span><span class="mer" id="ap"></span>
    </div>
    <div class="rule"></div>
    <div class="day" id="d"></div>
    <div class="date" id="dt"></div>
  </div>
<script>
(function(){
  var h=document.getElementById('h'),m=document.getElementById('m'),
      ap=document.getElementById('ap'),d=document.getElementById('d'),
      dt=document.getElementById('dt');
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var mons=['January','February','March','April','May','June','July',
            'August','September','October','November','December'];
  function pad(n){return n<10?'0'+n:''+n}
  function ord(n){
    if(n>3&&n<21)return n+'th';
    return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th');
  }
  function tick(){
    var n=new Date(), H=n.getHours(), hr=H%12; if(hr===0)hr=12;
    h.textContent=hr;
    m.textContent=pad(n.getMinutes());
    ap.textContent=H<12?'am':'pm';
    d.textContent=days[n.getDay()];
    dt.textContent=ord(n.getDate())+' '+mons[n.getMonth()]+' '+n.getFullYear();
  }
  tick(); setInterval(tick,1000);
})();
</script>
</body>
</html>
